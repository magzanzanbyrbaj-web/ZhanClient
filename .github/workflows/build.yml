
name: Build ZhanVisuals

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Extract project
        run: unzip ZhanVisuals-3.0-Source.zip

      - name: Build mod
        run: gradle -p ZhanVisuals-3.0 build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ZhanVisuals-JAR
          path: ZhanVisuals-3.0/build/libs/*.jar
